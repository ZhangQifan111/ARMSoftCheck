version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: prrc_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: prrc
      MYSQL_USER: prrc
      MYSQL_PASSWORD: prrc123
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prrc_backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: prrc
      MYSQL_USER: prrc
      MYSQL_PASSWORD: prrc123
      JWT_SECRET: prrc_jwt_secret_change_in_production_2024
      JWT_EXPIRE_MINUTES: 43200
      SEED_DATA_PATH: /app/seeds
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/seeds:/app/seeds
      - ./backend/seed_templates:/app/seed_templates

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prrc_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
